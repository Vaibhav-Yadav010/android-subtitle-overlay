// ----------------------------------------------------------------------------
// Plugins Section
// ----------------------------------------------------------------------------
// Applies the Android application plugin via version catalogs (libs.versions.toml).
// This plugin enables Android app-specific Gradle tasks and configurations.
plugins {
    alias(libs.plugins.android.application)
}

// ----------------------------------------------------------------------------
// Android Configuration Block
// ----------------------------------------------------------------------------
// Configures all Android-specific build options, including namespace, SDK versions,
// default application configuration, instrumentation, and native build settings.
android {
    namespace 'com.example.subtitles'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.subtitles"
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
            version "26.1.10909125"
        }
        externalNativeBuild {
            cmake {
                abiFilters 'armeabi-v7a', 'arm64-v8a'
                arguments "-DCMAKE_BUILD_TYPE=Release"
            }
        }
    }

    externalNativeBuild {
        cmake {
            version "3.22.1"
            path "src/main/jni/CMakeLists.txt"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Default debug configuration
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1', 'META-INF/LICENSE', 'META-INF/NOTICE']
            excludes += ['META-INF/licenses/ASM']
        }
    }
}

dependencies {
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation "com.alphacephei:vosk-android:0.3.47"
    implementation "com.microsoft.onnxruntime:onnxruntime-android:1.22.0"
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation "androidx.work:work-runtime:2.8.0"
    implementation 'com.google.mlkit:translate:17.0.1'
    implementation 'ai.picovoice:falcon-android:1.0.2'
    implementation 'com.github.wendykierp:JTransforms:3.1'
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
name: Android CI

on:
  push:
    branches: ["main", "captionx-v2"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle
          cache-dependency-path: SubtitlesAppSubrimaProject/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;26.1.10909125"

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x SubtitlesAppSubrimaProject/gradlew

      - name: Build CaptionX debug APK
        working-directory: SubtitlesAppSubrimaProject
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload CaptionX APK
        uses: actions/upload-artifact@v4
        with:
          name: captionx-debug-apk
          path: SubtitlesAppSubrimaProject/app/build/outputs/apk/debug/app-debug.apk

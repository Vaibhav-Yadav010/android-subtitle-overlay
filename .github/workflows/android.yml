name: Android CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply translation throttle patch
        if: github.event_name == 'push'
        run: python3 .github/patch_translation.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle
          cache-dependency-path: SubtitlesAppSubrimaProject/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;26.1.10909125"

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x SubtitlesAppSubrimaProject/gradlew

      - name: Build debug APK
        working-directory: SubtitlesAppSubrimaProject
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: subrima-debug-apk-patched
          path: SubtitlesAppSubrimaProject/app/build/outputs/apk/debug/app-debug.apk

      - name: Persist patch and remove temporary patch files
        if: github.event_name == 'push'
        run: |
          rm -f .github/patch_translation.py .github/workflows/apply-translation-throttle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SubtitlesAppSubrimaProject/app/src/main/java/com/example/subtitles/model/translation/MlKitTranslator.java .github/patch_translation.py .github/workflows/apply-translation-throttle.yml
          if git diff --cached --quiet; then
            echo "No patch persistence changes needed."
          else
            git commit -m "perf: throttle translation requests"
            git push
          fi

name: Android CI

on:
  push:
    branches: ["main", "captionx-v2"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle
          cache-dependency-path: SubtitlesAppSubrimaProject/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;26.1.10909125"

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x SubtitlesAppSubrimaProject/gradlew

      - name: Reduce live transcription backlog
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("SubtitlesAppSubrimaProject/app/src/main/java/com/example/subtitles/model/transcription/core/VoskStreamTranscriber.java")
          s = p.read_text()
          old = "this.audioQueue = new ArrayBlockingQueue<>(8);"
          new = "this.audioQueue = new ArrayBlockingQueue<>(3);"
          if old not in s:
              raise SystemExit("Expected audio queue declaration not found")
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Build CaptionX debug APK
        working-directory: SubtitlesAppSubrimaProject
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload CaptionX APK
        uses: actions/upload-artifact@v4
        with:
          name: captionx-debug-apk
          path: SubtitlesAppSubrimaProject/app/build/outputs/apk/debug/app-debug.apk

      - name: Persist latency change on CaptionX branch
        if: github.ref == 'refs/heads/captionx-v2'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SubtitlesAppSubrimaProject/app/src/main/java/com/example/subtitles/model/transcription/core/VoskStreamTranscriber.java
          git diff --cached --quiet || git commit -m "perf: cap live transcription backlog"
          git push

name: MainActivity remediation

on:
  push:
    branches: [mainactivity-lifecycle-remediation]

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch MainActivity lifecycle
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('SubtitlesAppSubrimaProject/app/src/main/java/com/example/subtitles/MainActivity.java')
          s = p.read_text()

          s = s.replace(
              '    private AlertDialog modelDownloadDialog;\n',
              '    private AlertDialog modelDownloadDialog;\n\n    /// Guards asynchronous callbacks from a destroyed/recreated Activity instance\n    private volatile boolean destroyed = false;\n    private int initializationGeneration = 0;\n'
          )

          s = s.replace(
              '    private void initializeMainPipeline() {\n        ExecutorService exec = Executors.newSingleThreadExecutor();\n',
              '    private void initializeMainPipeline() {\n        final int generation;\n        synchronized (lock) {\n            generation = ++initializationGeneration;\n        }\n        ExecutorService exec = Executors.newSingleThreadExecutor();\n'
          )

          s = s.replace(
              '                MainPipeline bgPipeline = new MainPipeline(this);\n                long dt = System.currentTimeMillis() - t0;\n                Log.d(TAG, "Pipeline init took " + dt + "ms");\n                runOnUiThread(() -> {\n                    pipeline = bgPipeline;\n                    mainButton.setEnabled(true);\n                    Log.d(TAG, "MainPipeline ready; start button enabled");\n                });',
              '                MainPipeline bgPipeline = new MainPipeline(getApplicationContext());\n                long dt = System.currentTimeMillis() - t0;\n                Log.d(TAG, "Pipeline init took " + dt + "ms");\n                if (destroyed || !isCurrentInitialization(generation)) {\n                    bgPipeline.destroy();\n                    return;\n                }\n                runOnUiThread(() -> {\n                    if (destroyed || !isCurrentInitialization(generation)) {\n                        bgPipeline.destroy();\n                        return;\n                    }\n                    pipeline = bgPipeline;\n                    mainButton.setEnabled(true);\n                    Log.d(TAG, "MainPipeline ready; start button enabled");\n                });'
          )

          s = s.replace(
              '                runOnUiThread(() -> {\n                    Toast.makeText(this,\n                            "Failed to initialize pipeline: " + e.getMessage(),\n                            Toast.LENGTH_LONG).show();\n                    mainButton.setEnabled(false);\n                    mainButton.setImageResource(R.drawable.turn_on);\n                });',
              '                if (!destroyed && isCurrentInitialization(generation)) {\n                    runOnUiThread(() -> {\n                        if (destroyed || !isCurrentInitialization(generation)) return;\n                        Toast.makeText(this,\n                                "Failed to initialize pipeline: " + e.getMessage(),\n                                Toast.LENGTH_LONG).show();\n                        mainButton.setEnabled(false);\n                        mainButton.setImageResource(R.drawable.turn_on);\n                    });\n                }'
          )

          s = s.replace(
              '    /**\n     * ---------------------------------------------------------------------\n     * Starts runtime model availability workflow.',
              '    private boolean isCurrentInitialization(int generation) {\n        synchronized (lock) {\n            return !destroyed && initializationGeneration == generation;\n        }\n    }\n\n    /**\n     * ---------------------------------------------------------------------\n     * Starts runtime model availability workflow.'
          )

          s = s.replace(
              '            public void onProgress(String modelName, int percentage) {\n                updateModelDownloadMessage("Downloading " + modelName + " (" + percentage + "%)");\n            }',
              '            public void onProgress(String modelName, int percentage) {\n                if (!destroyed) {\n                    updateModelDownloadMessage("Downloading " + modelName + " (" + percentage + "%)");\n                }\n            }'
          )

          s = s.replace(
              '            public void onSuccess() {\n                dismissModelDownloadDialog();\n                initializeMainPipeline();\n            }',
              '            public void onSuccess() {\n                if (destroyed) return;\n                dismissModelDownloadDialog();\n                initializeMainPipeline();\n            }'
          )

          s = s.replace(
              '            public void onError(String errorMessage) {\n                dismissModelDownloadDialog();\n                Toast.makeText(MainActivity.this, errorMessage, Toast.LENGTH_LONG).show();\n                mainButton.setEnabled(false);',
              '            public void onError(String errorMessage) {\n                if (destroyed) return;\n                dismissModelDownloadDialog();\n                Toast.makeText(MainActivity.this, errorMessage, Toast.LENGTH_LONG).show();\n                mainButton.setEnabled(false);'
          )

          s = s.replace(
              '    protected void onDestroy() {\n        super.onDestroy();',
              '    protected void onDestroy() {\n        synchronized (lock) {\n            destroyed = true;\n            initializationGeneration++;\n        }\n        super.onDestroy();'
          )

          p.write_text(s)
          PY
          git diff --check
          git diff -- SubtitlesAppSubrimaProject/app/src/main/java/com/example/subtitles/MainActivity.java
          git status --short

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SubtitlesAppSubrimaProject/app/src/main/java/com/example/subtitles/MainActivity.java
          git commit -m "fix: guard MainActivity asynchronous lifecycle" || exit 0
          git push
name: Vosk Remediation Patch

on:
  push:
    branches: ["vosk-remediation-work"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply targeted Vosk lifecycle fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("SubtitlesAppSubrimaProject/app/src/main/java/com/example/subtitles/model/transcription/core/VoskStreamTranscriber.java")
          text = path.read_text()
          replacements = [
              ('    private final AtomicBoolean languageSwitchInProgress = new AtomicBoolean(false);\n\n    /** Executor used for async model switching */', '    private final AtomicBoolean languageSwitchInProgress = new AtomicBoolean(false);\n\n    /** Generation of the latest language-switch request. */\n    private long languageSwitchGeneration = 0L;\n\n    /** True after destroy() has begun; prevents stale async work from reviving the instance. */\n    private boolean destroyed = false;\n\n    /** Executor used for async model switching */'),
              ('    private void switchLanguage(String langCode) {', '    private void switchLanguage(String langCode, long generation) {'),
              ('            notifyError(e);\n            return;  // old transcription is still running — do not kill it\n        }\n\n        // ── Phase 3: atomic swap', '            notifyError(e);\n            return;  // old transcription is still running — do not kill it\n        }\n\n        synchronized (this) {\n            if (destroyed || generation != languageSwitchGeneration) {\n                try { newModel.close(); } catch (Exception closeError) { Log.w(TAG, "Failed to close stale Vosk model", closeError); }\n                return;\n            }\n        }\n\n        // ── Phase 3: atomic swap'),
              ('        stop();\n        synchronized (this) {\n            notifyListener("", "new language detected: " + langCode);', '        stop();\n        synchronized (this) {\n            if (destroyed || generation != languageSwitchGeneration) {\n                try { newModel.close(); } catch (Exception closeError) { Log.w(TAG, "Failed to close stale Vosk model after stop", closeError); }\n                return;\n            }\n            notifyListener("", "new language detected: " + langCode);'),
              ('            model = newModel;\n            resetTranscriber(true);\n            Log.i(TAG, "Loaded model for language=" + langCode);\n            start();\n            notifyLangChange(currentLang, modelPath);', '            model = newModel;\n            resetTranscriber(true);\n            if (recognizer == null) {\n                try { model.close(); } catch (Exception closeError) { Log.w(TAG, "Failed to close model after recognizer initialization failure", closeError); }\n                model = null;\n                modelPath = "";\n                currentLang = "";\n                return;\n            }\n            Log.i(TAG, "Loaded model for language=" + langCode);\n            start();\n            notifyLangChange(currentLang, modelPath);'),
              ('    public void acceptAudio(TaggedAudioChunk chunk) {\n        if (!running.get() || recognizer == null) return;\n\n        // Speaker-change ONNX inference is intentionally disabled in the real-time audio path.\n        // It performs a synchronous 1-second model inference every 250 ms and can block audio delivery.\n        // Audio is kept flowing directly into the Vosk queue for low-latency transcription.\n\n\n        if (!audioQueue.offer(chunk)) {\n    audioQueue.poll();\n    audioQueue.offer(chunk);\n}\n    }', '    public void acceptAudio(TaggedAudioChunk chunk) {\n        synchronized (this) {\n            if (!running.get() || recognizer == null || destroyed) return;\n            if (!audioQueue.offer(chunk)) {\n                audioQueue.poll();\n                audioQueue.offer(chunk);\n            }\n        }\n    }'),
              ('    public void destroy() {\n        stop();', '    public synchronized void destroy() {\n        destroyed = true;\n        ++languageSwitchGeneration;\n        stop();')
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one match, found {text.count(old)}: {old[:80]!r}")
              text = text.replace(old, new, 1)
          path.write_text(text)
          print("Targeted Vosk patch applied successfully")
          PY

      - name: Validate patch
        run: |
          git diff --check
          git diff -- SubtitlesAppSubrimaProject/app/src/main/java/com/example/subtitles/model/transcription/core/VoskStreamTranscriber.java

      - name: Commit and push patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SubtitlesAppSubrimaProject/app/src/main/java/com/example/subtitles/model/transcription/core/VoskStreamTranscriber.java
          git commit -m "fix: harden Vosk language switch lifecycle"
          git push

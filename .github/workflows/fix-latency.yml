name: Fix latency and translation output

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Patch latency bottlenecks
        run: |
          python3 <<'PY'
          from pathlib import Path

          # Remove synchronous Pyannote/ONNX speaker inference from the 250 ms
          # audio callback. It analyzes a 1-second window synchronously and can
          # block audio delivery, which directly increases Vosk latency.
          vosk = Path("SubtitlesAppSubrimaProject/app/src/main/java/com/example/subtitles/model/transcription/core/VoskStreamTranscriber.java")
          text = vosk.read_text(encoding="utf-8")
          start_marker = "        try {\n            if (speakerChange != null && speakerChange.acceptAudio(chunk.getShortAudio())) {"
          end_marker = "\n\n        if (!audioQueue.offer(chunk))"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("Vosk speaker-analysis block not found")
          replacement = (
              "        // Speaker-change ONNX inference is intentionally disabled in the real-time audio path.\n"
              "        // It performs a synchronous 1-second model inference every 250 ms and can block audio delivery.\n"
              "        // Audio is kept flowing directly into the Vosk queue for low-latency transcription.\n"
          )
          text = text[:start] + replacement + text[end:]
          vosk.write_text(text, encoding="utf-8")

          # Translate only the current Vosk text. The previous implementation
          # translated previous+current text and then guessed the new portion
          # using source/target word counts. That is invalid across languages.
          ml = Path("SubtitlesAppSubrimaProject/app/src/main/java/com/example/subtitles/model/translation/MlKitTranslator.java")
          text = ml.read_text(encoding="utf-8")
          old = '''            String input = request.lastSourceSentence.isEmpty()\n                    ? request.text.trim()\n                    : request.lastSourceSentence.trim() + "\\n" + request.text.trim();'''
          if old not in text:
              raise SystemExit("Translator input block not found")
          text = text.replace(old, '''            String input = request.text.trim();''', 1)

          replacements = [
              ('''String onlyNew = extractNewPortion(\n                                        res,\n                                        request.text,\n                                        sourceLang,\n                                        targetLang\n                                );\n                                request.callback.onResult(res, onlyNew);''',
               '''request.callback.onResult(res, res);'''),
              ('''String onlyNew = extractNewPortion(\n                                        interRes,\n                                        request.text,\n                                        sourceLang,\n                                        targetLang\n                                );\n                                request.callback.onResult(interRes, onlyNew);''',
               '''request.callback.onResult(interRes, interRes);'''),
              ('''String onlyNew = extractNewPortion(\n                                                        finalRes,\n                                                        request.text,\n                                                        sourceLang,\n                                                        targetLang\n                                                );\n                                                request.callback.onResult(finalRes, onlyNew);''',
               '''request.callback.onResult(finalRes, finalRes);''')
          ]
          for old_call, new_call in replacements:
              if old_call not in text:
                  raise SystemExit("A translation callback block was not found")
              text = text.replace(old_call, new_call, 1)
          ml.write_text(text, encoding="utf-8")

          # Restore permanent CI to a normal build-only workflow. Remove both
          # the obsolete patch step and the old self-cleanup/push step.
          ci = Path(".github/workflows/android.yml")
          ci_text = ci.read_text(encoding="utf-8")
          ci_text = ci_text.replace("permissions:\n  contents: write", "permissions:\n  contents: read", 1)

          apply_marker = "      - name: Apply translation throttle patch\n"
          start = ci_text.find(apply_marker)
          if start >= 0:
              end = ci_text.find("      - name:", start + len(apply_marker))
              if end < 0:
                  raise SystemExit("Could not find next CI step after obsolete patch step")
              ci_text = ci_text[:start] + ci_text[end:]

          persist_marker = "      - name: Persist patch and remove temporary patch files\n"
          start = ci_text.find(persist_marker)
          if start >= 0:
              ci_text = ci_text[:start].rstrip() + "\n"

          ci.write_text(ci_text, encoding="utf-8")

          # Validate intended source changes and ensure permanent CI contains no
          # reference to temporary patch scripts.
          assert "String input = request.text.trim();" in text
          assert text.count("private PendingTranslation pendingTranslation;") == 1
          assert text.count("private void startNextTranslation()") == 1
          assert text.count("private void finishTranslation()") == 1
          assert "speakerChange != null && speakerChange.acceptAudio(chunk.getShortAudio())" not in vosk.read_text(encoding="utf-8")
          assert "patch_translation.py" not in ci_text
          print("Latency/translation patch validation passed")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle
          cache-dependency-path: SubtitlesAppSubrimaProject/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;26.1.10909125"

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x SubtitlesAppSubrimaProject/gradlew

      - name: Build low-latency debug APK
        working-directory: SubtitlesAppSubrimaProject
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload low-latency APK
        uses: actions/upload-artifact@v4
        with:
          name: subrima-low-latency-apk
          path: SubtitlesAppSubrimaProject/app/build/outputs/apk/debug/app-debug.apk

      - name: Persist source changes and remove temporary workflows
        run: |
          rm -f .github/workflows/fix-latency.yml .github/workflows/apply-translation-throttle.yml .github/patch_translation.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SubtitlesAppSubrimaProject/app/src/main/java/com/example/subtitles/model/transcription/core/VoskStreamTranscriber.java SubtitlesAppSubrimaProject/app/src/main/java/com/example/subtitles/model/translation/MlKitTranslator.java .github/workflows/android.yml .github/workflows/fix-latency.yml .github/workflows/apply-translation-throttle.yml .github/patch_translation.py
          git commit -m "perf: remove synchronous speaker analysis and simplify incremental translation"
          git push
